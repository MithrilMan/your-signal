name: Verify source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m pip install pytest
      - run: python -m pytest -q eval/tests
      - run: python eval/run.py eval/examples.jsonl
      - run: python scripts/build.py
